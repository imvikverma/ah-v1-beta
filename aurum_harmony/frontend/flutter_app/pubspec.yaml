name: aurum_harmony_frontend
description: Flutter frontend for AurumHarmony v1.0 Beta
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  url_launcher: ^6.2.0
  syncfusion_flutter_gauges: ^24.2.8
  cached_network_image: ^3.3.1
  lottie: ^2.7.0
  confetti: ^0.7.0
  vibration: ^1.9.0
  syncfusion_flutter_charts: ^24.2.9
  intl: ^0.19.0
  pdf: ^3.10.8
  csv: ^5.0.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/animations/loading.json
    - assets/animations/success.json
    - assets/animations/error.json

