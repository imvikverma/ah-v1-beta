name: Deploy Flutter App to Firebase Hosting

on:
  push:
    branches: [ main, master ]
    paths:
      - 'aurum_harmony/frontend/flutter_app/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Enable Flutter Web
      run: flutter config --enable-web

    - name: Get Flutter dependencies
      working-directory: aurum_harmony/frontend/flutter_app
      run: flutter pub get

    - name: Build Flutter Web
      working-directory: aurum_harmony/frontend/flutter_app
      run: flutter build web --release --dart-define=FLUTTER_WEB_USE_EXPERIMENTAL_CANVAS_TEXT=true

    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        projectId: aurumharmony-prod
        channelId: live
        entryPoint: aurum_harmony/frontend/flutter_app
