{
  "services": [
    {
      "type": "web",
      "name": "aurumharmony-backend",
      "runtime": "python3",
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "python aurum_harmony/master_codebase/Master_AurumHarmony_261125.py",
      "envVars": [
        {
          "key": "FLASK_ENV",
          "value": "production"
        },
        {
          "key": "PYTHON_VERSION",
          "value": "3.8"
        }
      ]
    }
  ]
}